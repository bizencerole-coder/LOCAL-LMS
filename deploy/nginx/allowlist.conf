# Networks allowed to reach the LMS. Narrow this to the real campus subnets, then:
#   docker compose restart nginx
# Keep 172.16.0.0/12: Docker's own bridge networks use it (the container healthcheck
# and the API's /ready check come from there). On Docker Desktop (Windows/macOS)
# every client appears as the Docker gateway, so this list cannot tell clients
# apart there; use the host firewall instead (docs/setup-guide.md).
allow 127.0.0.1;
allow 10.0.0.0/8;
allow 172.16.0.0/12;
allow 192.168.0.0/16;
deny all;
