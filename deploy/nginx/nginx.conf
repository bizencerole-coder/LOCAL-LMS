user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65s;

    # Long progressive downloads: give slow Wi-Fi clients room before timing out.
    send_timeout 120s;
    client_body_timeout 30s;
    client_header_timeout 30s;
    client_max_body_size 1m;
    # Dashboard uploads carry each file's title and description in the query string; a
    # 2,000-character description in Malayalam is about 18 KB once URL-encoded.
    large_client_header_buffers 4 32k;

    # Request class for the access log. A map is evaluated when the line is written,
    # so it is defined even for requests rejected before any location runs
    # (bad Host, TRACE) and for non-GET /media requests.
    map $uri $lms_log_type {
        default        other;
        ~^/media/      media;
        ~^/api/        api;
        ~^/admin       admin;
        ~^/docs        api;
        /health        api;
        /ready         api;
        /openapi.json  api;
    }

    # Access logs as JSON lines. $uri is logged instead of $request_uri so signed
    # media URL parameters (expires/md5) do not reach the access log. The /media/
    # location also lowers its error-log level, because error-log lines include the
    # full request line; see site.conf.template.
    log_format lms_json escape=json
        '{"time":"$time_iso8601","type":"$lms_log_type","remote_addr":"$remote_addr",'
        '"request_id":"$request_id","method":"$request_method","uri":"$uri",'
        '"status":$status,"bytes_sent":$body_bytes_sent,"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time","range":"$http_range",'
        '"sid":"$arg_sid","user_agent":"$http_user_agent"}';

    # Only the LMS site. The official image also ships conf.d/default.conf (the
    # "Welcome to nginx" server for server_name localhost), which must not load.
    include /etc/nginx/conf.d/site.conf;
}
