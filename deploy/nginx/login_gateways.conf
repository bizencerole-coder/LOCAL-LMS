# Addresses that many tablets share (a router that translates addresses: NAT) and
# load-test computers. They may sign in 20 times a second with bursts of 600, instead of
# 10 times a minute. One per line, e.g.
#   172.18.1.1 1;       # the Wi-Fi router's address as the server sees it
#   10.20.30.0/24 1;    # or a range
# Written by deploy/scripts/set_network.sh --login-gateway <address>; then:
#   docker compose restart nginx
